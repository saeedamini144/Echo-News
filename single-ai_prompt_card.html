<!DOCTYPE html>
<html lang="fa-IR" dir="rtl" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرشیو گالری پرامپت | کارت پرامپت</title>

    <!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║  پیش‌نمایش «کارت پرامپت» (template-parts/prompt-card.php)             ║
    ║  استفاده: آرشیو گالری، آرشیو دسته/مدل، جست‌وجو، صفحه اصلی، مشابه‌ها   ║
    ║                                                                      ║
    ║  نگاشت فیلدها:                                                        ║
    ║   تصویر ............ get_the_post_thumbnail($id,'medium_large')      ║
    ║   ratio ............ _ep_ratio  → متغیر CSS  --r  (مثلاً 4/5)        ║
    ║   مدل (نشان) ....... taxonomy prompt_model  (اولین ترم)              ║
    ║   دسته ............. taxonomy prompt_category (اولین ترم)            ║
    ║   عنوان ............ the_title()  (لینک اصلی کارت = همین لینک)       ║
    ║   snippet .......... wp_trim_words(_ep_prompt, 22)  (فقط hover)      ║
    ║   کپی .............. data-copy="_ep_prompt"  (نیازی به باز کردن صفحه)║
    ║   تعداد تصاویر ..... count(_ep_gallery)+1  (اگر >1 بود نشان بده)     ║
    ║   کپی‌شده/بازدید ... _ep_copies / post_views_count                   ║
    ║                                                                      ║
    ║  سئو: عنوان داخل <h3><a> است (لینک قابل خزش)، تصویر alt دارد،         ║
    ║  width/height ثابت (بدون CLS)، lazy-load. دکمه کپی <button> است       ║
    ║  و لینک نیست.                                                         ║
    ╚══════════════════════════════════════════════════════════════════════╝
    -->

    <link rel="stylesheet" href="assets/css/plugins/fontawesome-5.css">
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rtl.css">

    <style>
        /* ==========================================================
           کارت پرامپت — پیشوند ep- (بعداً به style.css منتقل می‌شود)
           ========================================================== */
        .ep {
            --ep-card: #ffffff;
            --ep-soft: #f6f7fb;
            --ep-border: #e7e9f1;
            --ep-text: #181823;
            --ep-muted: #6b6f80;
            --ep-accent: var(--color-primary, #537FE7);
            --ep-accent-soft: rgba(83, 127, 231, .1);
            --ep-orange: #F05600;
            --ep-radius: 14px;
            --ep-shadow: 0 14px 34px rgba(24, 24, 35, .1);
        }

        html[data-theme=dark] .ep {
            --ep-card: #181823;
            --ep-soft: #212130;
            --ep-border: rgba(255, 255, 255, .1);
            --ep-text: #ffffff;
            --ep-muted: rgba(255, 255, 255, .62);
            --ep-accent-soft: rgba(83, 127, 231, .22);
            --ep-shadow: 0 14px 34px rgba(0, 0, 0, .45);
        }

        html[data-theme=dark] body {
            background: var(--bg-dark-three);
        }

        .ep a {
            text-decoration: none;
        }

        /* ---------- شبکه ---------- */
        .ep-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        /* حالت ماسونری: هر کارت با نسبت واقعی تصویر خودش */
        .ep-grid.is-masonry {
            display: block;
            column-count: 3;
            column-gap: 22px;
        }

        .ep-grid.is-masonry .ep-card {
            break-inside: avoid;
            margin-bottom: 22px;
        }

        .ep-grid.is-masonry .ep-card__media {
            aspect-ratio: var(--r, 4/5);
        }

        /* ---------- کارت ---------- */
        .ep-card {
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: var(--ep-radius);
            background: var(--ep-card);
            border: 1px solid var(--ep-border);
            overflow: hidden;
            transition: transform .3s, box-shadow .3s, border-color .3s;
        }

        .ep-card:hover,
        .ep-card:focus-within {
            transform: translateY(-4px);
            box-shadow: var(--ep-shadow);
            border-color: transparent;
        }

        /* تصویر: پیش‌فرض ۴:۵ ثابت تا ردیف‌ها هم‌تراز بمانند */
        .ep-card__media {
            position: relative;
            aspect-ratio: 4/5;
            overflow: hidden;
            background: var(--ep-soft);
        }

        .ep-card__media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .6s cubic-bezier(.2, .7, .2, 1);
        }

        .ep-card:hover .ep-card__media img {
            transform: scale(1.06);
        }

        /* گرادیان پایین تصویر برای خوانایی snippet و نشان‌ها */
        .ep-card__media::after {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 62%;
            background: linear-gradient(to top, rgba(10, 10, 20, .88), rgba(10, 10, 20, 0));
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }

        .ep-card:hover .ep-card__media::after,
        .ep-card:focus-within .ep-card__media::after,
        .ep-grid.show-snippet .ep-card__media::after {
            opacity: 1;
        }

        /* نشان مدل */
        .ep-card__model {
            position: absolute;
            inset-inline-start: 10px;
            top: 10px;
            z-index: 2;
            padding: 4px 11px;
            border-radius: 7px;
            font-size: 11.5px;
            font-weight: 600;
            line-height: 1.5;
            color: #fff;
            background: rgba(15, 15, 28, .6);
            backdrop-filter: blur(6px);
            direction: ltr;
        }

        /* دکمه کپی سریع */
        .ep-card__copy {
            position: absolute;
            inset-inline-end: 10px;
            top: 10px;
            z-index: 3;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #fff;
            background: rgba(15, 15, 28, .6);
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: background .2s, transform .2s, opacity .2s;
        }

        .ep-card__copy:hover {
            background: var(--ep-accent);
            transform: scale(1.08);
        }

        .ep-card__copy.is-done {
            background: var(--color-success, #3EB75E);
        }

        /* روی دسکتاپ فقط با hover دیده شود؛ روی لمسی همیشه */
        @media (hover: hover) {
            .ep-card__copy {
                opacity: 0;
                transform: translateY(-4px);
            }

            .ep-card:hover .ep-card__copy,
            .ep-card:focus-within .ep-card__copy,
            .ep-card__copy:focus-visible {
                opacity: 1;
                transform: none;
            }

            .ep-card__copy:hover {
                transform: scale(1.08);
            }
        }

        /* چند تصویر */
        .ep-card__count {
            position: absolute;
            inset-inline-end: 10px;
            bottom: 10px;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 7px;
            font-size: 11.5px;
            color: #fff;
            background: rgba(15, 15, 28, .6);
            backdrop-filter: blur(6px);
            transition: opacity .25s;
        }

        .ep-card:hover .ep-card__count,
        .ep-grid.show-snippet .ep-card__count {
            opacity: 0;
        }

        /* snippet پرامپت روی تصویر (hover) */
        .ep-card__snippet {
            position: absolute;
            inset-inline: 14px;
            bottom: 14px;
            z-index: 2;
            margin: 0;
            direction: ltr;
            text-align: left;
            font-family: "Inter", system-ui, sans-serif;
            font-size: 12.5px;
            line-height: 1.7;
            color: rgba(255, 255, 255, .92);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .3s, transform .3s;
            pointer-events: none;
        }

        .ep-card:hover .ep-card__snippet,
        .ep-card:focus-within .ep-card__snippet,
        .ep-grid.show-snippet .ep-card__snippet {
            opacity: 1;
            transform: none;
        }

        /* روی لمسی hover نداریم؛ snippet نمایش داده نشود، عنوان کافی است */
        @media (hover: none) {

            .ep-card__snippet,
            .ep-card__media::after {
                display: none;
            }

            .ep-card:hover .ep-card__count {
                opacity: 1;
            }
        }

        /* بدنه */
        .ep-card__body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px 16px 14px;
            flex: 1;
        }

        .ep-card__cat {
            font-size: 12px;
            font-weight: 700;
            color: var(--ep-orange);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ep-card__cat::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .ep-card__title {
            margin: 0;
            font-size: 15.5px;
            line-height: 1.9;
            font-weight: 700;
            color: var(--ep-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ep-card__title a {
            color: inherit;
            transition: color .2s;
        }

        /* کل کارت قابل کلیک؛ لینک عنوان کشیده می‌شود (دکمه کپی بالاتر از آن است) */
        .ep-card__title a::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .ep-card:hover .ep-card__title a {
            color: var(--ep-accent);
        }

        .ep-card__meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px dashed var(--ep-border);
            font-size: 12.5px;
            color: var(--ep-muted);
        }

        .ep-card__meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .ep-card__meta span:last-child {
            margin-inline-start: auto;
        }

        .ep-card__meta i {
            color: var(--ep-accent);
        }

        /* ---------- ریبون ---------- */
        .ep-card__flag {
            position: absolute;
            inset-inline-start: 10px;
            top: 48px;
            z-index: 2;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            color: #fff;
            background: var(--ep-orange);
        }

        /* ---------- کارت فشرده (سایدبار / مشابه) ---------- */
        .ep-row {
            position: relative;
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 10px;
            border-radius: 12px;
            background: var(--ep-card);
            border: 1px solid var(--ep-border);
            transition: .25s;
        }

        .ep-row:hover {
            border-color: var(--ep-accent);
            box-shadow: var(--ep-shadow);
        }

        .ep-row__img {
            flex: none;
            width: 84px;
            height: 84px;
            border-radius: 10px;
            overflow: hidden;
        }

        .ep-row__img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .ep-row__txt {
            min-width: 0;
            flex: 1;
        }

        .ep-row__txt small {
            display: block;
            font-size: 11.5px;
            color: var(--ep-orange);
            font-weight: 700;
            margin-bottom: 2px;
        }

        .ep-row__txt h4 {
            margin: 0;
            font-size: 14px;
            line-height: 1.8;
            color: var(--ep-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ep-row__txt h4 a {
            color: inherit;
        }

        .ep-row__txt h4 a::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .ep-row .ep-card__copy {
            position: static;
            flex: none;
            opacity: 1;
            transform: none;
            z-index: 2;
            width: 34px;
            height: 34px;
            background: var(--ep-soft);
            color: var(--ep-text);
            backdrop-filter: none;
            position: relative;
        }

        .ep-row .ep-card__copy:hover {
            background: var(--ep-accent);
            color: #fff;
        }

        /* ---------- فیلتر (نمونه برای context) ---------- */
        .ep-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 26px;
        }

        .ep-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13.5px;
            border: 1px solid var(--ep-border);
            background: var(--ep-card);
            color: var(--ep-text);
            transition: .2s;
            font-family: inherit;
            width: auto;
            cursor: pointer;
        }

        .ep-chip:hover {
            border-color: var(--ep-accent);
            color: var(--ep-accent);
        }

        .ep-chip.is-active {
            background: var(--ep-accent);
            border-color: var(--ep-accent);
            color: #fff;
        }

        .ep-bar__sort {
            margin-inline-start: auto;
            color: var(--ep-muted);
            font-size: 13px;
        }

        .ep-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            margin: 46px 0 16px;
            color: var(--ep-text);
        }

        .ep-section-title i {
            color: var(--ep-accent);
        }

        .ep-pager {
            display: flex;
            justify-content: center;
            margin-top: 34px;
        }

        .ep-more {
            width: auto;
            border: 1px solid var(--ep-border);
            background: var(--ep-card);
            color: var(--ep-text);
            padding: 11px 34px;
            border-radius: 10px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: .2s;
        }

        .ep-more:hover {
            background: var(--ep-accent);
            color: #fff;
            border-color: var(--ep-accent);
        }

        .ep-rows {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* ---------- toast / demo / mock ---------- */
        .ep-toast {
            position: fixed;
            inset-inline: 0;
            bottom: 90px;
            margin: auto;
            width: max-content;
            max-width: 90vw;
            background: #181823;
            color: #fff;
            padding: 11px 22px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            opacity: 0;
            transform: translateY(14px);
            pointer-events: none;
            transition: .3s;
            z-index: 10000;
        }

        .ep-toast.is-show {
            opacity: 1;
            transform: none;
        }

        .demo-bar {
            position: fixed;
            inset-inline-start: 14px;
            bottom: 14px;
            z-index: 9000;
            background: #181823;
            color: #fff;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
        }

        .demo-bar b {
            display: block;
            margin-bottom: 6px;
            color: #ffb48c;
        }

        .demo-bar div {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .demo-bar button {
            width: auto;
            border: 1px solid rgba(255, 255, 255, .25);
            background: transparent;
            color: #fff;
            border-radius: 6px;
            padding: 3px 10px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .demo-bar button.on {
            background: var(--color-primary);
            border-color: var(--color-primary);
        }

        .mock-header {
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        html[data-theme=dark] .mock-header {
            background: #0f0f1c;
            border-color: rgba(255, 255, 255, .1);
        }

        .mock-header .in {
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 18px 0;
        }

        .mock-header .logo {
            font-weight: 900;
            font-size: 22px;
            color: var(--color-primary);
        }

        .mock-header nav {
            display: flex;
            gap: 22px;
            flex: 1;
            font-size: 15px;
        }

        .mock-header nav a {
            color: var(--color-heading-1);
        }

        html[data-theme=dark] .mock-header nav a {
            color: #fff;
        }

        .mock-header .tg {
            width: 38px;
            height: 38px;
            border: 1px solid #ddd;
            background: none;
            border-radius: 8px;
            cursor: pointer;
            color: inherit;
        }

        html[data-theme=dark] .mock-header .tg {
            color: #fff;
            border-color: rgba(255, 255, 255, .2);
        }

        /* ---------- ریسپانسیو ---------- */
        @media (max-width: 991px) {
            .ep-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .ep-grid.is-masonry {
                column-count: 2;
            }

            .mock-header nav {
                display: none;
            }
        }

        @media (max-width: 575px) {
            .ep-grid {
                gap: 12px;
            }

            .ep-grid.is-masonry {
                column-gap: 12px;
            }

            .ep-grid.is-masonry .ep-card {
                margin-bottom: 12px;
            }

            .ep-card__body {
                padding: 11px 12px;
                gap: 6px;
            }

            .ep-card__title {
                font-size: 13.5px;
                line-height: 1.8;
            }

            .ep-card__meta {
                gap: 10px;
                font-size: 11.5px;
            }

            .ep-rows {
                grid-template-columns: 1fr;
            }

            .ep-bar__sort {
                display: none;
            }

            .ep-bar {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 6px;
            }

            .ep-chip {
                flex: none;
            }
        }
    </style>
</head>

<body class="home-one">

    <header class="mock-header">
        <div class="container">
            <div class="in">
                <a class="logo" href="#">اکو نیوز</a>
                <nav><a href="#">خانه</a><a href="#">اخبار</a><a href="#" style="color:var(--color-primary);font-weight:700">گالری پرامپت</a><a href="#">آموزش هوش مصنوعی</a></nav>
                <button class="tg" id="themeToggle" aria-label="حالت تاریک"><i class="fa-regular fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="innerpage ep">
        <div class="echo-breadcrumb-area">
            <div class="container">
                <div class="breadcrumb-inner text-center">
                    <nav class="breadcrumbs">
                        <ul style="justify-content:center">
                            <li><a href="#">صفحه اصلی</a></li>
                            <li class="current">گالری پرامپت</li>
                        </ul>
                    </nav>
                    <h1 style="font-size:26px;margin:14px 0 0">گالری پرامپت هوش مصنوعی</h1>
                </div>
            </div>
        </div>

        <section class="echo-hero-section inner inner-2 inner-3">
            <div class="echo-hero">
                <div class="container">

                    <!-- فیلتر نمونه (در مرحله بعد جداگانه طراحی می‌شود) -->
                    <div class="ep-bar">
                        <button class="ep-chip is-active">همه</button>
                        <button class="ep-chip">پرتره</button><button class="ep-chip">لوگو</button><button class="ep-chip">معماری</button>
                        <button class="ep-chip">انیمه</button><button class="ep-chip">محصول</button><button class="ep-chip">منظره</button>
                        <span class="ep-bar__sort"><i class="fa-light fa-arrow-down-wide-short"></i> جدیدترین</span>
                    </div>

                    <!-- ===== شبکه کارت‌ها ===== -->
                    <div class="ep-grid" id="grid"></div>

                    <div class="ep-pager"><button class="ep-more">نمایش پرامپت‌های بیشتر</button></div>

                    <!-- ===== نسخه فشرده ===== -->
                    <h2 class="ep-section-title"><i class="fa-light fa-grid-2"></i> نسخه فشرده (سایدبار، مشابه‌ها، جست‌وجو)</h2>
                    <div class="ep-rows" id="rows"></div>

                </div>
            </div>
        </section>
    </div>

    <!--
      ╭─ template کارت (= template-parts/prompt-card.php) ─╮
      متغیرها با {{ }} مشخص شده‌اند.
    -->
    <template id="tpl-card">
        <article class="ep-card" style="--r: {{ratioCss}}">
            <div class="ep-card__media">
                <img src="{{img}}" alt="{{title}}" width="{{w}}" height="{{h}}" loading="lazy" decoding="async">
                <span class="ep-card__model">{{model}}</span>
                {{flag}}
                <button class="ep-card__copy" type="button" data-copy="{{id}}" aria-label="کپی پرامپت: {{title}}" title="کپی پرامپت"><i class="fa-light fa-copy"></i></button>
                {{count}}
                <p class="ep-card__snippet" aria-hidden="true">{{snippet}}</p>
            </div>
            <div class="ep-card__body">
                <a class="ep-card__cat" href="#">{{cat}}</a>
                <h3 class="ep-card__title"><a href="#">{{title}}</a></h3>
                <div class="ep-card__meta">
                    <span title="تعداد کپی"><i class="fa-light fa-copy"></i>{{copies}}</span>
                    <span title="بازدید"><i class="fa-light fa-eye"></i>{{views}}</span>
                    <span>{{date}}</span>
                </div>
            </div>
        </article>
    </template>

    <template id="tpl-row">
        <article class="ep-row">
            <div class="ep-row__img"><img src="{{img}}" alt="{{title}}" width="84" height="84" loading="lazy"></div>
            <div class="ep-row__txt">
                <small>{{cat}} · {{model}}</small>
                <h4><a href="#">{{title}}</a></h4>
            </div>
            <button class="ep-card__copy" type="button" data-copy="{{id}}" aria-label="کپی پرامپت" title="کپی پرامپت"><i class="fa-light fa-copy"></i></button>
        </article>
    </template>

    <div class="ep-toast" id="toast" role="status"></div>

    <div class="demo-bar">
        <b>دمو</b>
        <div>
            <button id="dLayout">ماسونری / یکنواخت</button>
            <button id="dSnip">نمایش حالت hover</button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            var RATIOS = { '1:1': [800, 800], '4:5': [640, 800], '3:2': [900, 600], '16:9': [960, 540], '9:16': [450, 800] };
            var ITEMS = [
                { cat: 'پرتره', model: 'Midjourney', r: '4:5', hue: 28, t: 'پرامپت میدجرنی برای ساخت پرتره سینمایی با نور طلایی غروب', p: 'cinematic close-up portrait of [a young woman with freckles], golden hour backlight, soft rim light on hair, shallow depth of field, 85mm lens, film grain', c: '۱٫۲k', v: '۴٫۳k', d: '۲۲ مهر', n: 4, flag: 'جدید' },
                { cat: 'لوگو', model: 'DALL·E 3', r: '1:1', hue: 215, t: 'پرامپت ساخت لوگوی مینیمال کافه با هوش مصنوعی', p: 'minimal flat vector logo for a coffee shop named [Brew Lab], simple coffee cup icon, solid dark brown on pure white background', c: '۸۷۳', v: '۲٫۱k', d: '۲۰ مهر' },
                { cat: 'معماری', model: 'Flux', r: '16:9', hue: 160, t: 'پرامپت ساخت نمای خارجی ویلای مدرن در دل جنگل با مه صبحگاهی', p: 'photorealistic exterior of a modern minimalist villa made of concrete and glass, surrounded by dense pine forest, morning mist', c: '۲۱۵', v: '۹۸۰', d: '۱۸ مهر', n: 2 },
                { cat: 'انیمه', model: 'Stable Diffusion', r: '9:16', hue: 300, t: 'پرامپت شخصیت انیمه‌ای دختر جنگجو با شمشیر نورانی', p: 'anime style full body illustration of [a warrior girl] holding a glowing sword, flowing silver hair, neon city night background', c: '۶۵۸', v: '۱٫۸k', d: '۱۶ مهر', flag: 'پرطرفدار' },
                { cat: 'محصول', model: 'Midjourney', r: '1:1', hue: 340, t: 'پرامپت عکس محصول عطر روی پایه مرمری با نور استودیویی', p: 'luxury perfume bottle on a white marble pedestal, soft studio lighting, subtle reflections, minimal background, product photography', c: '۴۲۰', v: '۱٫۱k', d: '۱۴ مهر' },
                { cat: 'منظره', model: 'Flux', r: '3:2', hue: 190, t: 'پرامپت منظره کوهستان در طلوع با دریاچه آینه‌ای', p: 'majestic mountain range at sunrise reflected in a mirror-like alpine lake, golden light, mist, ultra detailed, landscape photography', c: '۳۰۲', v: '۷۲۰', d: '۱۰ مهر' },
                { cat: 'پرتره', model: 'DALL·E 3', r: '4:5', hue: 12, t: 'پرامپت پرتره استودیویی مرد مسن با ریش سفید', p: 'studio portrait of an elderly man with a white beard, dramatic side lighting, deep wrinkles, 50mm lens, black background', c: '۱۹۰', v: '۶۱۰', d: '۸ مهر' },
                { cat: 'معماری', model: 'Midjourney', r: '4:5', hue: 120, t: 'پرامپت طراحی داخلی اتاق نشیمن اسکاندیناوی', p: 'scandinavian living room interior, light oak furniture, large windows, soft daylight, cozy minimal decor, architectural digest style', c: '۵۴۰', v: '۲٫۴k', d: '۵ مهر' },
                { cat: 'انیمه', model: 'Stable Diffusion', r: '16:9', hue: 260, t: 'پرامپت پس‌زمینه انیمه‌ای شهر شب بارانی', p: 'anime background art of a rainy night city street, neon signs reflecting on wet asphalt, cinematic, studio ghibli inspired', c: '۳۶۰', v: '۹۰۰', d: '۲ مهر' }
            ];

            function art(hue, ratio, seed) {
                var s = RATIOS[ratio], w = s[0], h = s[1], hh = (hue + seed * 38) % 360;
                var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "' viewBox='0 0 " + w + " " + h + "'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(" + hh + ",85%,62%)'/><stop offset='1' stop-color='hsl(" + (hh + 55) + ",75%,22%)'/></linearGradient><radialGradient id='r' cx='.7' cy='.28' r='.6'><stop offset='0' stop-color='white' stop-opacity='.75'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><rect width='100%' height='100%' fill='url(%23g)'/><rect width='100%' height='100%' fill='url(%23r)'/><circle cx='" + w * .32 + "' cy='" + h * .62 + "' r='" + Math.min(w, h) * .26 + "' fill='black' opacity='.22'/><circle cx='" + w * .66 + "' cy='" + h * .36 + "' r='" + Math.min(w, h) * .13 + "' fill='white' opacity='.35'/></svg>";
                return 'data:image/svg+xml;utf8,' + svg.replace(/#/g, '%23').replace(/</g, '%3C').replace(/>/g, '%3E');
            }
            var $ = function (s) { return document.querySelector(s); };
            function fill(tpl, o) { return tpl.replace(/\{\{(\w+)\}\}/g, function (_, k) { return o[k] != null ? o[k] : ''; }); }
            function trim(t) { return t.split(' ').slice(0, 22).join(' ') + '…'; }

            var tplCard = $('#tpl-card').innerHTML, tplRow = $('#tpl-row').innerHTML;

            $('#grid').innerHTML = ITEMS.map(function (d, i) {
                var s = RATIOS[d.r];
                return fill(tplCard, {
                    id: i, title: d.t, cat: d.cat, model: d.model, img: art(d.hue, d.r, 0), w: s[0], h: s[1],
                    ratioCss: s[0] + '/' + s[1], snippet: trim(d.p.replace(/\[|\]/g, '')), copies: d.c, views: d.v, date: d.d,
                    flag: d.flag ? '<span class="ep-card__flag">' + d.flag + '</span>' : '',
                    count: d.n ? '<span class="ep-card__count"><i class="fa-light fa-layer-group"></i>' + d.n + ' تصویر</span>' : ''
                });
            }).join('');

            $('#rows').innerHTML = ITEMS.slice(0, 4).map(function (d, i) {
                return fill(tplRow, { id: i, title: d.t, cat: d.cat, model: d.model, img: art(d.hue, '1:1', 1) });
            }).join('');

            function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('is-show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('is-show'); }, 1700); }
            document.addEventListener('click', function (e) {
                var b = e.target.closest('[data-copy]'); if (!b) return;
                e.preventDefault();
                var txt = ITEMS[+b.dataset.copy].p, ic = b.querySelector('i'), cls = ic.className;
                var done = function () { toast('پرامپت کپی شد ✓'); b.classList.add('is-done'); ic.className = 'fa-light fa-check'; setTimeout(function () { b.classList.remove('is-done'); ic.className = cls; }, 1500); };
                if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done);
                else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) { } ta.remove(); done(); }
            });

            $('#themeToggle').onclick = function () { var r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); };
            $('#dLayout').onclick = function () { $('#grid').classList.toggle('is-masonry'); };
            $('#dSnip').onclick = function () { $('#grid').classList.toggle('show-snippet'); };

            /* فیلتر نمونه */
            document.querySelectorAll('.ep-bar .ep-chip').forEach(function (c) {
                c.onclick = function () { document.querySelectorAll('.ep-bar .ep-chip').forEach(function (x) { x.classList.remove('is-active'); }); c.classList.add('is-active'); };
            });
        })();
    </script>
</body>

</html>
